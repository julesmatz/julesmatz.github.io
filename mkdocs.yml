site_name: notes
site_url: https://julesmatz.github.io/

nav:
  - Home: index.md
  - Algebra:
    - Vector space: Algebra/vector_space.md
    - Inner product, norm: Algebra/inner_prod.md
    - Linear map: Algebra/linear_map.md
    - Matrix inversion: Algebra/matrix_inversion.md
    - Geometry (2D):
      - Circle-circle intersection: Algebra/Geometry2D/circle_circle_intersection.md
  - Modelling:
    - Linear models:
      - Complex exponential for dynamics: Modelling/complex_exponential.md
      - Linear dynamics: Modelling/linear_dynamical_systems.md
      - Mass-spring-damper: Modelling/example_mass_spring_damper.md
    - Modelling approaches: Modelling/modelling.md
    - PCE: Modelling/PCE.md
  - Estimation:
    - Gaussian: Estimation/gaussian.md
    - Bayesian inference: Estimation/Bayesian_inference.md
    - Bayesian inference for Gaussians: Estimation/Bayesian_inference_gaussian.md
    - Kalman filter: Estimation/Kalman.md
  - Control:
    - Sliding Mode: Control/sliding_mode.md
  - Tools:
    - Website: Tools/website.md
    - Mardown: Tools/markdown.md
    - Unix: Tools/unix.md
    - Git: Tools/git.md
    - C++: Tools/cpp.md
    - Python: Tools/python.md
    - julia: Tools/julia.md
    - ROS: Tools/ros.md
    - ROS2: Tools/ros2.md
    - URDF: Tools/urdf.md

theme:
  name: material
  font:
    text: Inria Serif
    code: Ubuntu mono

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - footnotes
  - tables
  - pymdownx.blocks.caption

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
